[package]
name = "bake-agent-context"
version = "0.4.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/core-rs/bake-agent-context"
description = "Install context files from Cargo dependencies for coding agents"
readme = "readme.md"
include = ["src/**", "tests/fixtures/**", "context/**", "Cargo.toml", "readme.md", "license.md", "releases.md"]

[workspace]
members = ["bake"]
resolver = "3"

[workspace.metadata.bake]
manifest = "bake/Cargo.toml"

[workspace.metadata.bake.release]
reviewers = ["core-rs/maintainers"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(coverage)"] }

[dependencies]
bake = "0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml_ng = "0.10"
core-markdown = "0.1.0"

[patch.crates-io]
bake-agent-context = { path = "." }

[dev-dependencies]
tempfile = "3.27"
