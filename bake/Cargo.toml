[package]
name = "bake-agent-context-tasks"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
base-project = ">=0.1.0"
bake = ">=0.20, <1"
bake-agent-context = { version = "0.4.2", path = ".." }
